<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - LilyJoe Textiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%); 
            min-height: 100vh; 
            font-family: 'Inter', system-ui, sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-white/10 rounded-full mb-6">
            <i class="fas fa-wifi-slash text-4xl text-white/80"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-3">You're Offline</h1>
        <p class="text-blue-200 mb-8 max-w-md">
            Please check your internet connection. Some features may be limited while offline.
        </p>
        <button onclick="window.location.reload()" 
            class="px-8 py-3 bg-white text-blue-600 rounded-xl font-semibold hover:bg-blue-50 transition-colors">
            <i class="fas fa-refresh mr-2"></i>Try Again
        </button>
    </div>
</body>
</html>
